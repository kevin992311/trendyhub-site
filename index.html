<body>

<header class="site-header">

<section class="hero">

      <span class="catalog-count" id="catalog-count"></span>
    </div>
    <div class="grid" id="grid">
      <div class="state-msg">Loading today's pieces…</div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>Trendyhub Stitched Collection</span>

  </div>
