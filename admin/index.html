<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trendyhub — Manage Collection</title>
</head>
<body>
  <!-- Decap CMS admin. Logging in is handled by Decap's own backend
       (git-gateway on Netlify, or a GitHub/GitLab backend), so there is no
       custom login form here and nothing to POST by hand.
       IMPORTANT: login only works AFTER the site is deployed on Netlify with
       Identity + Git Gateway enabled. On a plain localhost static server,
       Decap's auth POSTs return "Unsupported method ('POST')" and login
       cannot complete — that is expected, not a code bug. -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", function (user) {
        if (!user) {
          window.netlifyIdentity.on("login", function () { document.location.href = "/admin/"; });
        }
      });
    }
  </script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
